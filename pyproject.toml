[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yapper-nimbus"
version = "4.0.0"
description = "Private, offline-first Windows dictation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Nimbus" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.1",
  "huggingface-hub==1.23.0",
  "numpy==2.4.6",
  "sounddevice==0.5.5",
  "av==18.0.0",
  "keyboard==0.13.5",
  "pyperclip==1.11.0",
  "psutil==7.2.2",
  "uiautomation==2.0.29",
  "PySide6-Essentials==6.11.1",
]

[project.optional-dependencies]
smart = [
  "torch==2.5.1",
  "transformers==5.14.1",
  "accelerate==1.14.0",
]
build = ["pyinstaller==6.22.1"]

[project.scripts]
yapper = "main:main"

[project.urls]
Homepage = "https://github.com/nimbus890/Yapper"
Issues = "https://github.com/nimbus890/Yapper/issues"

[tool.setuptools]
packages = ["aura_flow"]
py-modules = ["main", "setup_models", "setup_semantic"]
